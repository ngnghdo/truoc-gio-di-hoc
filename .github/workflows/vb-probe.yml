name: Thử nguồn toàn văn
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save playwright@1.47.0 && npx playwright install --with-deps chromium && sudo apt-get install -y poppler-utils >/dev/null
      - run: node scripts/vb-probe.mjs
      - run: |
          git config user.name "vb-bot"; git config user.email "actions@users.noreply.github.com"
          git pull -q --rebase || true
          git add vbdbg && git commit -m "probe" && git push || true
